<div style="background:#f3f4f6;padding:30px 10px;font-family:Arial,sans-serif">

  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">

        <!-- CARD -->
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden">

          <!-- HEADER -->
          <tr>
            <td style="background:#ff6b3d;padding:0px;text-align:center">
              <img src="https://lanzallamas.tv/lll-hub/mails/images/gif.gif" alt="LLL Hub" style="display:block;margin:auto" />
            </td>
          </tr>

          <!-- CONTENT -->
          <tr>
            <td style="padding:24px">

              {{CONTENT}}

            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td style="padding:16px;text-align:center;font-size:12px;color:#9ca3af">
              LLL Hub · Sistema de gestión interna
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</div>
